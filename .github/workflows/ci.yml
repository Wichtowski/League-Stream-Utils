name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        working-directory: v2
      - run: bun run lint
        working-directory: v2
      - run: bun run typecheck
        working-directory: v2

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        working-directory: v2
      - run: bun run test
        working-directory: v2

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lsu
          POSTGRES_PASSWORD: lsu_dev_password
          POSTGRES_DB: league_stream_utils
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lsu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: lsu
          MONGO_INITDB_ROOT_PASSWORD: lsu_dev_password
          MONGO_INITDB_DATABASE: league_stream_utils
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        working-directory: v2
      - run: npx playwright install --with-deps chromium
        working-directory: v2/apps/web
      - run: bun run test:e2e
        working-directory: v2
        env:
          DATABASE_URL: postgresql://lsu:lsu_dev_password@localhost:5432/league_stream_utils
          MONGODB_URI: mongodb://lsu:lsu_dev_password@localhost:27017/league_stream_utils?authSource=admin
          JWT_SECRET: ci-test-secret-key-min-32-chars-long

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        working-directory: v2
      - run: bun run build --filter=@lsu/web
        working-directory: v2
      - name: Deploy to Cloudflare
        run: bun run deploy
        working-directory: v2/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
